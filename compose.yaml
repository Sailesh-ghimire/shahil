name: workspace-crm

x-app: &app
  build:
    context: ./docker/php
  image: workspace-crm-php
  volumes:
    - ./:/var/www/html
  environment:
    PHP_OPCACHE_ENABLE: "1"
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
    PHP_OPCACHE_REVALIDATE_FREQ: "2"
    SSL_MODE: "off"
    SHOW_WELCOME_MESSAGE: "false"
    LOG_OUTPUT_LEVEL: "warn"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app
    ports:
      - "8080:8080"

  horizon:
    <<: *app
    command: ["php", "/var/www/html/artisan", "horizon"]
    stop_signal: SIGTERM
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      disable: true

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: crm
      MYSQL_USER: crm
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  backup:
    image: mysql:8.4
    entrypoint: ["sh", "/backup.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: secret
      DB_HOST: mysql
      DB_DATABASE: crm
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ./storage/backups:/backups
    depends_on:
      mysql:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    profiles: ["tools"]

volumes:
  mysql-data:
  redis-data:
